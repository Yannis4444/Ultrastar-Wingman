name: CI

on:
  push:
  pull_request:

jobs:
  # ubuntu, not windows-latest, although Windows is the target platform: the runners are
  # much faster and nothing in the suite is platform-specific. If a Windows-only regression
  # ever slips through (paths, file locking), add a windows-latest matrix entry here.
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy src tests
      - run: pytest

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      # `npm run build` type-checks (tsc -b) before bundling.
      - run: npm run build
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
