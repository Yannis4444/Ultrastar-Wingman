name: Docs

# Builds the user guide (docs/user, zensical) and publishes it on GitHub Pages:
# https://yannis4444.github.io/Ultrastar-Wingman/
# Needs Settings > Pages > Source set to "GitHub Actions" once.
on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time, and a newer push replaces a waiting one.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: docs/requirements.txt
      - run: pip install -r docs/requirements.txt
      # From docs/, and only from there: the Wingman icon shortcodes resolve against the
      # working directory (docs/dev/documentation.md, section 13).
      - run: python -m zensical build --strict --clean
        working-directory: docs
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
