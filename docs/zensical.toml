[project]
site_name = "Ultrastar Wingman"
site_description = "Karaoke companion for Ultrastar Deluxe: songs, players, wishes and scores."

# The user guide only. `docs/dev/` stays outside this directory on purpose: zensical
# builds every markdown file it finds under `docs_dir` and has no exclude option, so
# scoping the directory is the only way to keep the developer guides off the site.
docs_dir = "user"
site_dir = "site"

# Relative to `docs_dir`, so the stylesheet ships with the site.
extra_css = ["assets/stylesheets/wingman.css"]

# Sections are folders. The first entry of a section is its index page, which
# `navigation.indexes` turns into the section's own landing page. Only files that
# exist are listed here.
# Five tabs, named by what the reader is doing (documentation.md section 2). Inside a
# tab the sidebar shows only that tab's chapters; a chapter's glyph comes from the
# `icon` in its index page's front matter.
nav = [
  { "Overview" = "index.md" },
  { "Sing" = [
    { "At the party" = [
      "party/index.md",
      { "Wish for a song" = "party/wishlist.md" },
      { "Sing a song" = "party/sing.md" },
      { "Let the reel pick" = "party/reel.md" },
      { "Play background music" = "party/music.md" },
    ] },
    { "The song list" = [
      "songs/index.md",
      { "Filter the list" = "songs/filter.md" },
      { "Open a song" = "songs/song.md" },
      { "Playlists" = "songs/playlists.md" },
      { "Download songs" = "songs/download.md" },
      { "Fix or delete a song" = "songs/fix-or-delete.md" },
    ] },
    { "Scores" = [
      "scores/index.md",
      { "A party's scores" = "scores/party.md" },
      { "Your own scores" = "scores/your-scores.md" },
    ] },
    { "Achievements" = [
      "achievements/index.md",
    ] },
  ] },
  { "Host" = [
    { "Get started" = [
      "start/index.md",
      { "Install and run" = "start/install.md" },
      { "Connect Ultrastar Deluxe" = "start/ultrastar-deluxe.md" },
      { "Let guests in" = "start/join.md" },
    ] },
    { "The host screen" = [
      "host-screen/index.md",
      { "Manage from the TV" = "host-screen/manage.md" },
    ] },
    { "Player selector" = [
      "selector/index.md",
      { "Build the device" = "selector/build.md" },
      { "Set up the device" = "selector/setup.md" },
      { "Cards and players" = "selector/cards.md" },
    ] },
    { "Fix a problem" = [
      "help/index.md",
      { "Ultrastar Deluxe problems" = "help/ultrastar-deluxe.md" },
    ] },
  ] },
  { "Manage" = [
    { "People" = [
      "people/index.md",
      { "Players and avatars" = "people/players.md" },
      { "Groups and permissions" = "people/groups.md" },
      { "Single sign-on" = "people/single-sign-on.md" },
    ] },
    { "Settings" = [
      "settings/index.md",
      { "All settings" = "settings/reference.md" },
    ] },
    { "Tags" = [
      "tags/index.md",
      { "Built-in marks and facets" = "tags/built-in.md" },
    ] },
    { "Achievements" = [
      "achievements/manage/index.md",
      { "Make an achievement" = "achievements/manage/create.md" },
      { "Make a badge picture" = "achievements/manage/picture.md" },
    ] },
  ] },
  { "Integrate" = [
    "integrate/index.md",
    { "The REST API" = "integrate/rest-api.md" },
    { "Authenticate a script" = "integrate/authentication.md" },
    { "Live events" = "integrate/events.md" },
    { "Player selector devices" = "integrate/devices.md" },
    { "Files and configuration" = "integrate/files.md" },
  ] },
]

[project.theme]
language = "en"
# Template overrides and the Wingman icon set (`overrides/.icons/wingman/`). Relative to
# this file. The sidebar reads a chapter's `icon` front matter through it.
custom_dir = "overrides"
# Both files are relative to `docs_dir`. The logo is the app's own, the favicon
# the app's own 32x32 icon.
logo = "assets/logo.png"
favicon = "assets/favicon.png"
features = [
  "content.code.copy",
  "content.tabs.link",
  "navigation.footer",
  "navigation.indexes",
  "navigation.path",
  "navigation.sections",
  "navigation.tabs",
  "navigation.tabs.sticky",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
  "toc.follow",
]

# Dark first, matching the app's own theme; the toggle offers light for whoever wants it.
# Both palettes take the branded primary and accent out of `wingman.css`.
[[project.theme.palette]]
scheme = "slate"
primary = "custom"
accent = "custom"
toggle.icon = "lucide/moon"
toggle.name = "Switch to light mode"

[[project.theme.palette]]
scheme = "default"
primary = "custom"
accent = "custom"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

# Setting this table replaces zensical's own defaults, so every extension the site
# uses has to stand here. `toc` and `tables` are always on and are not listed.
[project.markdown_extensions]
admonition = {}
attr_list = {}
md_in_html = {}
"pymdownx.blocks.caption" = {}
"pymdownx.details" = {}
# The app's glyphs, as `:wingman-<name>:` shortcodes. `custom_icons` belongs under
# `options`; as a top-level key it raises a KeyError at build time. The path is
# resolved against the working directory, so always build from `docs/`.
"pymdownx.emoji" = { emoji_index = "zensical.extensions.emoji.twemoji", emoji_generator = "zensical.extensions.emoji.to_svg", options = { custom_icons = ["overrides/.icons"] } }
# The three options zensical sets by default, which replacing the table drops.
# The theme's own stylesheet styles code lines through the `__span` ids that
# `line_spans` writes, so a code block loses that styling without them.
"pymdownx.highlight" = { anchor_linenums = true, line_spans = "__span", pygments_lang_class = true }
"pymdownx.inlinehilite" = {}
"pymdownx.keys" = {}
"pymdownx.superfences" = {}
"pymdownx.tabbed" = { alternate_style = true }
toc = { permalink = true }

# The lightbox every screenshot opens in.
[project.plugins]
glightbox = {}
