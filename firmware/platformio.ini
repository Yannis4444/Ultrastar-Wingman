; PlatformIO project of the player selector device — see docs/dev/firmware.md.
; Everything is pinned: the platform by release zip, every library by tag or version.

[platformio]
default_envs = esp32dev

[common]
; -std goes on our own translation units only (build_src_flags): the Arduino core 3.x
; headers are built with the platform's own standard and do not survive being pinned back.
src_flags = -Wall -Wextra -std=gnu++17

[env:esp32dev]
; The registry's `espressif32` stopped at Arduino core 2.x; pioarduino carries core 3.x.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
board = esp32dev
framework = arduino
monitor_speed = 115200
; CORE_DEBUG_LEVEL is a framework flag: the USB port speaks JSON lines and nothing else,
; so the core must not log to it.
build_flags = -DCORE_DEBUG_LEVEL=0
build_src_flags = ${common.src_flags}
lib_deps =
    https://github.com/OSSLibraries/Arduino_MFRC522v2.git#2.0.6
    bblanchon/ArduinoJson@7.4.3
    ; The optional strip (docs/dev/player-selector.md §11.2). Compiled into every image: a
    ; build without a strip drives a pin nothing is listening on.
    adafruit/Adafruit NeoPixel@1.15.5
extra_scripts =
    pre:scripts/version.py
    post:scripts/merge_bin.py
; `pio check` looks at our code only: --skip-packages leaves out the framework, and this
; leaves out the pinned libraries, whose own headers cppcheck cannot preprocess.
check_src_filters =
    +<src/*>
    +<test/*>
; Two suppressions: every class here is used from another translation unit, which cppcheck
; cannot see, and the pinned libraries are reported through the headers our files include —
; cppcheck cannot preprocess ArduinoJson's macros and that is not ours to fix.
check_flags = cppcheck: --suppress=unusedFunction --suppress=*:*libdeps*

; Host build of the pure modules — no Arduino header is reachable here, which is the
; boundary of docs/dev/firmware.md enforced by the compiler.
[env:native]
platform = native
test_framework = unity
test_build_src = yes
build_src_filter = +<CardTracker.cpp> +<Buttons.cpp> +<Report.cpp> +<Response.cpp>
build_flags = ${common.src_flags}
; Response.cpp parses the server's answer, so the host build needs the same parser the
; device uses — and nothing else.
lib_deps = bblanchon/ArduinoJson@7.4.3
