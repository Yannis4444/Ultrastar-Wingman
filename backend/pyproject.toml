[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ultrastar-wingman"
version = "0.1.0"
description = "Companion app for Ultrastar Deluxe: song downloads, players, statistics and a web UI"
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "Yannis Vierkoetter" }]
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "sqlalchemy[asyncio]",
    "aiosqlite",
    "alembic",
    "pydantic",
    "pydantic-settings",
    # FastAPI needs it to parse multipart form data (avatar uploads).
    "python-multipart",
    "platformdirs",
    # Password hashing. argon2id is the current recommendation and this is the reference
    # binding; rolling our own KDF parameters on top of hashlib is not a few lines of code.
    "argon2-cffi",
    "httpx",
    "websockets",
    "charset-normalizer",
    "mutagen",
    # Parses USDB's HTML search results; their table markup is not machine-readable data.
    "beautifulsoup4",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
    "ruff",
    "mypy",
]

[project.scripts]
ultrastar-wingman = "ultrastar_wingman.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/ultrastar_wingman"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC"]

[tool.mypy]
python_version = "3.12"
disallow_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true

[[tool.mypy.overrides]]
module = "mutagen.*"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
